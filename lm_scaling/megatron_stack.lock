# The Megatron backend's stack, pinned to exact commits.
#
# Read and enforced by `lm_scaling/make_megatron_stack.sh`. Whitespace-
# delimited, `#` starts a comment; four columns, plus an optional fifth:
#
#   <kind>  <name>  <url>  <commit>  [branch]
#
# WHY A LOCKFILE AND NOT A GIT SUBMODULE OF oellm-autoexp.
#
#   * Three of autoexp's own four submodules are declared with
#     `git@github.com:` URLs. Nesting it as a submodule here would pull that
#     into this repository, where every clone without a GitHub SSH key would
#     fail on repositories that are all public. The script rewrites those URLs
#     instead, scoped to the clone it makes.
#   * `external/` is deliberately gitignored: the cluster checkout is synced,
#     not committed, so what belongs in git is the pin, not the tree.
#
# WHY IT IS CHECKED AND NOT JUST WRITTEN. `submodule update --init --recursive`
# resolves whatever the parent commit points at, which is right -- but if the
# parent moves, the ladder changes framework without a word. That is precisely
# the variable this comparison exists to hold fixed: at 47M/6BT the two
# frameworks disagree by 0.049 nats on identical configuration, which is larger
# than most of the effects being measured. `--verify` turns a moved pin into an
# error instead of a footnote.
#
# THE COMMITS BELOW were resolved on 2026-09-28. The first Megatron campaign
# (harvest/megatron_ladder.tsv) ran on the previous pins, autoexp 6cdc977a and
# Megatron 40a52158 -- the parents of the current ones, which add the sweep
# configs and one checkpoint-loading fix and change nothing about the model.
#
# TWO PINS ARE OURS AND NOT UPSTREAM'S, both on a branch named
# `feat/complex-kda` in the respective OpenEuroLLM repository, both pushed:
#
#   submodules/Megatron-LM 7644b362  two commits on top of 514b31b3
#     40a52158  adds `complex_kda` as an experimental attention variant. The arms are
#       NOT selected by an arm name: Megatron builds the mixer from
#       `--experimental-attention-variant complex_kda` and the gate fields
#       (`--linear-gate-activation`, `--linear-beta-max`, `--linear-output-gate`,
#       `--linear-drop-qkv-silu`, `--linear-hybrid-attention`, ...), placed by
#       `--linear-attention-freq`, exactly as GatedDeltaNet is. (An earlier
#       draft of this file described a `--ckda-arm` argument; it was never
#       added. The CKDA_ARM variable submit_ladder.py still exports is read by
#       nothing.)
#     7644b362  makes `--ckpt-step` also select the distributed-optimizer state
#       of a `torch`-format checkpoint. Before it, Megatron re-read the tracker
#       for that state, so a cooldown branching off an earlier trunk save got
#       the trunk's LATEST master weights and iteration, trained nothing and
#       exited 0 -- the failure the branch views in submit_ladder.py exist to
#       dodge. They stay harmless; with this commit they are no longer needed.
#   oellm-autoexp          0323e25c  two commits on top of bd5a54b4 (hybrid_exp)
#     6cdc977a  the three files that mirror Megatron's argument table
#       (base_defaults.yaml, cli_metadata.py, config_schema.py), so those
#       fields survive autoexp's config layer.
#     0323e25c  the ladder as autoexp sweeps, `config/experiments/korbi/
#       complex_kda/`: a spec, a generator, and generated stable -> cooldown
#       sweeps for ladder, ladder_medium and ladder_finegrained (the latter
#       adding 1-4BT at 47M-302M); and the submodule move to 7644b362.
#
# They are ordinary commits on ordinary branches, not a patch applied over
# someone else's tree, so `git log` says who changed what and a reader gets
# them from the same clone as everything else.
#
# THE ORCHESTRATION LIBRARIES ARE NO LONGER PINNED HERE. hydra_staged_sweep,
# slurm_gen and monitor used to be pip-installed from a branch, which no git
# mechanism pinned -- the reason this file existed in the first place. autoexp
# has since vendored all three (`oellm_autoexp/{hydra_staged_sweep,slurm_gen,
# monitor}`, commit 9ba40f1, an ancestor of the pin below) and imports only the
# vendored copies, so the autoexp commit pins them and separate pip installs
# would be dead weight.

# --- cloned by the script ---------------------------------------------------

# `feat/complex-kda` is OURS, two commits on top of `hybrid_exp`. The commit is the
# pin; the branch is how to fetch it cheaply, and where to push it.
repo       oellm-autoexp            https://github.com/OpenEuroLLM/oellm-autoexp.git          0323e25c66a9a2bfc83eb12c4c867823aea9ac0d  feat/complex-kda

# --- pinned BY autoexp's tree, recorded here so a moved pin is visible -------
# The script does not clone these itself -- `submodule update --recursive`
# does, from the parent commit above -- it checks that what landed is this.
# Also ours: two commits on top of 514b31b3, the complex_kda variant and the
# --ckpt-step fix. The branch column is documentation -- submodules resolve from
# the parent commit above, not from a branch.
submodule  submodules/Megatron-LM      https://github.com/OpenEuroLLM/NVIDIA-Megatron-LM.git  7644b3626826c626eeeb45ce979532983844b298  feat/complex-kda
submodule  submodules/titan-oellm      https://github.com/OpenEuroLLM/titan-oellm.git         11e1737b44ad6cb43998851ce742951a86c6c985
submodule  submodules/oellm_evals      https://github.com/OpenEuroLLM/oellm-evals.git         5e8225c5e116e514a9ed9569ababdf733291543b
submodule  submodules/Megatron-Bridge  https://github.com/NVIDIA-NeMo/Megatron-Bridge.git     0dae728241d4ead96c5da7aba7d2a383e58bf7d7
