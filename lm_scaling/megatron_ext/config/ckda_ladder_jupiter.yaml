# @package _global_
# The ladder's Megatron root config. OURS, in this repo, not borrowed.
#
# It began as a copy of the reference's own scaling config
# (oellm-autoexp `config/experiments/korbi/megatron_niccolo_130M_scaling_jupiter.yaml`,
# arXiv:2608.28308), because that is the config whose 50M/6BT cell we
# reproduced to 0.0048 nats -- 2.9224 against their published 2.9272. Every
# line that differs from it differs deliberately and says why.
#
# WHAT CHANGED, and why each:
#
#   adam_beta2   0.99 -> 0.95   asked for, one value across the whole ladder.
#                               The reference sweeps 0.99 below 300M and 0.95
#                               above, which would put a hyperparameter change
#                               inside our N axis.
#   add_qkv_bias true -> false  asked for. Biases live only inside the (C)KDA
#                               layers, which carry fla's own and are not
#                               reached by this flag. Both bias flags are set
#                               here and checked by
#                               tests/lm_scaling/test_megatron_variant.py.
#   qk_layernorm true -> false  the default arm; `attn-qknorm` turns it back
#                               on. submit_ladder sets it from the arm, so the
#                               label and the flag cannot disagree.
#   job auto_restart -> default a campaign monitor that resubmits is how
#                               manually cancelled jobs came back once. These
#                               cells are hours, not days; a failure should
#                               stay failed until it is looked at.
#   container -> liger_mamba    the image with fla in it, which the mixer needs.
#
# WHAT DELIBERATELY DID NOT CHANGE: rotary_base is absent here exactly as it is
# absent there, so both take Megatron's 10000. The smoke config on the other
# branch sets 100000 and is not what their published runs used.
#
# Geometry, batch, learning rate and token budget all arrive as per-cell
# overrides from `submit_ladder.py`; the values below are a default point that
# has to compose, not a cell anyone runs.
defaults:
  - ../base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter_liger_mamba
  - /slurm: jupiter
  - /backend/megatron: [base, data_nemonicco_jupiter]
  - /sweep: none
  - override /job: default
  - _self_

aux:
  experiment_group: "megatron_ladder"
  total_tokens: "${oc.eval:'${aux.seq_len}*${aux.gbs}*${backend.megatron.train_iters}'}"
  tokens: 6_000_000_000
  decay_fraction: 0.2
  gbs: 32
  seq_len: 4096
  start_iter: 0
  additional_tag: ""

backend:
  megatron:
    accumulate_allreduce_grads_in_fp32: true
    adam_beta2: 0.95
    add_qkv_bias: false
    add_bias_linear: false
    align_param_gather: false
    attention_dropout: 0
    bf16: true
    bias_dropout_fusion: false
    bias_gelu_fusion: false
    bias_swiglu_fusion: false
    # NOT torch_dist. Sharded checkpointing validates that every key's access
    # pattern covers all num_layers slots, and in a 3:1 hybrid the attention
    # layers' `core_attention._extra_state` exists in 3 of 12 -- so the save
    # aborts with "9 ShardedObject are missing" AFTER training, which is the
    # expensive place to find out. The pure arms are unaffected, which is what
    # makes it easy to miss. We run data-parallel only, every rank holding a
    # full replica and every chain segment at the same world size, so a plain
    # checkpoint loses nothing that sharding was buying.
    ckpt_format: torch
    classes_fraction: 1
    clip_grad: 1
    data_per_class_fraction: 1
    dataloader_type: cyclic
    expert_tensor_parallel_size: 1
    global_batch_size: ${aux.gbs}
    gradient_accumulation_fusion: false
    head_lr_mult: 1.0
    hidden_dropout: 0
    log_interval: 10
    log_progress: true
    log_throughput: true
    # A default point, so the bare config composes; every cell overrides it.
    lr: 0.002
    lr_decay_style: WSD
    lr_warmup_init: 0
    # Theirs, and NOT scaled with the budget: the reference holds 2000 across
    # its whole ladder, so scaling it here would be a second difference riding
    # along with N and D.
    lr_warmup_iters: 2000
    lr_wsd_decay_iters: "${oc.eval:'int(${aux.decay_fraction} * ${backend.megatron.train_iters})'}"
    lr_wsd_decay_style: linear
    mask_factor: 1
    max_position_embeddings: ${aux.seq_len}
    min_loss_scale: 1
    min_lr: 1.0e-05
    normalization: RMSNorm
    # THE CORPUS, PINNED HERE. The `data_nemonicco_jupiter` group in defaults
    # supplies split/blend, but its paths are the branch's, and they are not
    # the same paths on every branch: on hybrid_exp the train prefix is a
    # jureap59 directory that does not exist for us, which is a missing .bin
    # at data-loader build time. The corpus is what makes this ladder
    # comparable to the reference and to the torchtitan one, so it is ours to
    # name, not something to inherit.
    #
    # Train is the 15% Nemotron-CC downsample the reference trained on. Valid
    # is the same 5% held-out split they used, from the copy we can read --
    # theirs lives under projectnucleus, which we are not in.
    train_data_path:
      - /e/data1/datasets/products/openeurollm/pretokenized/neox/copy_nemotron_downsampled_15p/high-all
    valid_data_path:
      - /e/project1/e-sta-openeurollm/poeppel1/datasets/nemotron_downsampled_5p_valid/high-all
    num_dataset_builder_threads: 6
    num_workers: 7
    overlap_p2p_comm: false
    padded_vocab_size: 50304
    position_embedding_type: rope
    qk_layernorm: false
    rerun_mode: disabled
    rotary_percent: 1
    rotary_scaling_factor: 1
    sample_rate: 1
    save: ${job.base_output_dir}
    seq_length: ${aux.seq_len}
    swiglu: true
    tokenizer_model: EleutherAI/gpt-neox-20b
    tokenizer_type: HuggingFaceTokenizer
    train_iters: "${oc.eval:'(${aux.tokens}+${aux.seq_len}*${aux.gbs}-1)//(${aux.seq_len}*${aux.gbs})'}"
    use_distributed_optimizer: true
    use_flash_attn: true
    wandb_project: complex_kda_megatron
    weight_decay: 0.1
    expert_model_parallel_size: 1
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    sequence_parallel: false
    grad_reduce_in_bf16: false
    untie_embeddings_and_output_weights: false

    wandb_exp_name: ${job.name}
    wandb_save_dir: ${job.base_output_dir}/wandb
    tensorboard_dir: ${job.base_output_dir}/tensorboard

  env:
    TOKENIZERS_PARALLELISM: "false"
    # NO TRANSFORMERS_CACHE. The reference config sets it, and it is harmless
    # there because that container carries transformers 5.x, which removed the
    # variable. The linattn image has 4.57, which still honours it AND gives it
    # precedence over HF_HUB_CACHE -- so it looked in $HF_HOME/transformers,
    # which is empty, and every rank died on LocalEntryNotFoundError before the
    # first iteration. HUGGINGFACE_HUB_CACHE below is where the tokenizer is.
    # PINNED, not inherited from the submitting shell.
    #
    # ${oc.env:HF_HOME} resolves at submit time from whatever environment
    # happens to run the submitter, so a change to the login profile silently
    # reroutes a campaign. It did: HF_HOME moved to a scratch path with no
    # tokenizer in it, and 31 medium jobs went into the queue pointing at a
    # cache that would have failed every one of them at startup.
    #
    # CKDA_HF_HOME overrides it deliberately, which is the difference that
    # matters -- a variable nobody else sets cannot be changed by accident.
    # The default moved on 2026-09-16 when the jureap59 project cache was
    # cleared out: /e/project1/jureap59/poeppel1/cache no longer holds the
    # tokenizer, and every job that started after the deletion died on
    # LocalEntryNotFoundError about two minutes in. The pin is what made that
    # a one-line change rather than a resubmission against whatever the shell
    # happened to say that hour.
    HF_HOME: ${oc.env:CKDA_HF_HOME,/e/fscratch/jureap59/poeppel1/cache}
    HUGGINGFACE_HUB_CACHE: ${oc.env:CKDA_HF_HOME,/e/fscratch/jureap59/poeppel1/cache}/hub
    # NODE-LOCAL TRITON CACHE. Unset, Triton writes its JIT cache under
    # $HF_HOME, which is on the jureap59 project -- and that project sits at
    # 3.76M of 4M inodes, because a Triton cache is tens of thousands of tiny
    # files. Every linear and hybrid job died on
    # "OSError: [Errno 122] Disk quota exceeded" inside chunk_kda_fwd, about 100
    # seconds in. The attention arms were untouched, which is what made it look
    # arm-specific rather than environmental.
    #
    # /tmp is node-local, so the cache does not persist between jobs and each
    # one recompiles its kernels. That costs a minute or two per job and is
    # what the branch's own campaigns do.
    TRITON_CACHE_DIR: "/tmp/ckda_${oc.env:USER}/triton"
    TORCHDYNAMO_DISABLE: "1"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

slurm:
  sbatch:
    nodes: 1
    time: "12:00:00"

stage: stable

job:
  name: ckda_${aux.additional_tag}_gbs${aux.gbs}_lr${backend.megatron.lr}_${stage}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${job.name}"
