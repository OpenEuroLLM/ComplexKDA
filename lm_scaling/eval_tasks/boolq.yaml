# boolq, from the parquet mirror instead of the super_glue loading script.
#
# Stock: `dataset_path: super_glue`, which is script-based and refused. The
# mirror `aps/super_glue` carries the same configs as parquet (boolq/{train,
# validation,test}-00000-of-00001.parquet) and is what the shared cache holds.
# Everything below the route is the stock config verbatim.
tag:
  - super-glue-lm-eval-v1
task: boolq
dataset_path: aps/super_glue
dataset_name: boolq
output_type: multiple_choice
training_split: train
validation_split: validation
doc_to_text: "{{passage}}\nQuestion: {{question}}?\nAnswer:"
doc_to_target: label
doc_to_choice: ["no", "yes"]
should_decontaminate: true
doc_to_decontamination_query: passage
metric_list:
  - metric: acc
metadata:
  version: 2.0
