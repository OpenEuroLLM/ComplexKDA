# S-NIAH-1, with metric keys for the SHORT cells the published table reports.
#
# Stock `lm_eval/tasks/ruler/niah_single_1.yaml` lists metrics 4096, 8192,
# 16384, 32768, 65536 and 131072 -- RULER's own grid, which starts at 4K.
# Gated DeltaNet-2's Table 3 reports 1K, 2K, 4K and 8K, and its 1K and 2K cells
# are where every recurrent model still scores near 100: dropping them keeps
# only the half of the table where the arms are already falling apart.
#
# A cell with no metric entry is not reported as zero, it is DISCARDED:
# `common_utils.process_results` returns `{"4096": -1.0, str(length): score}`,
# and lm-eval aggregates the keys it is handed against the names it knows. Ask
# for 1024 without this file and the run produces -1.0 for 4096 and silence for
# 1024 -- a finished job, a rendered table, and no numbers in it.
#
# Everything else is the stock config verbatim. The builders come from lm-eval
# itself (`ruler_niah.py` beside this file), so the samples are RULER's.
tag:
  - longcxt
task: niah_single_1
dataset_path: ""
dataset_name: ""
output_type: generate_until
test_split: test
custom_dataset: !function ruler_niah.niah_single_1
doc_to_text: "{{input}}"
doc_to_target: "{{outputs}}"
gen_prefix: "{{gen_prefix}}"
target_delimiter: " "
process_results: !function ruler_niah.process_results
metric_list:
  - metric: "1024"
    aggregation: !function ruler_niah.aggregate_metrics
    higher_is_better: true
  - metric: "2048"
    aggregation: !function ruler_niah.aggregate_metrics
    higher_is_better: true
  - metric: "4096"
    aggregation: !function ruler_niah.aggregate_metrics
    higher_is_better: true
  - metric: "8192"
    aggregation: !function ruler_niah.aggregate_metrics
    higher_is_better: true
  - metric: "16384"
    aggregation: !function ruler_niah.aggregate_metrics
    higher_is_better: true
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128
  until: []
repeats: 1
metadata:
  version: 1.0
