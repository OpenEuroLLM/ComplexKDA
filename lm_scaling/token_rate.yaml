# Measured TOKENS PER SECOND PER GPU. Data only; the lookup is throughput.py.
#
# This file exists because a wall-clock estimate must not round-trip through
# FLOPs. `throughput.yaml` records TFLOP/s, and turning that back into tokens
# per second needs a FLOPs-per-token convention -- which has to be the SAME
# convention the rate was measured under, or the answer is wrong by their
# ratio. It was not:
#
#   torchtitan   6*(nparams - nparams_embedding)
#                  + 6*n_layers*n_heads*head_dims*seq_len
#   throughput   6*N_non_embedding
#
# The attention term the second one drops is not small at this context. Every
# number here is read straight off torchtitan's own `tps:` field, so wall
# clock is tokens / (rate * world GPUs) with nothing in between.
#
# The FLOPs convention has a second consequence worth knowing, which is why
# the MFU column is reporting and not pricing: torchtitan adds that attention
# term for EVERY arm, including the linear ones, which do not compute it, so
# two arms' "MFU" are not measured against the same denominator and must not
# be compared. Tokens per second can be.
#
# Sections and entries are keyed exactly as peak_mbs.yaml and throughput.yaml:
# `<gpu>_seq<context>_<stack>_g<world GPUs>`, then `arch|rung: {mbs: rate}`.
# Measured by lm_scaling/titan_mbs_probe.py --yaml --unit tps, from the runs
# that established the micro-batch ceilings.

