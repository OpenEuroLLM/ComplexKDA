[model]
name = "fla"
config = "/gpfs/scratch/ehpc390/complex_kda_flame_smoke/configs/complex_kda_qwen3_smoke"
tokenizer_path = "/gpfs/projects/ehpc390/.huggingface/hub/models--Qwen--Qwen3-0.6B/snapshots/c1899de289a04d12100db370d81485cdf75e47ca"

[job]
description = "Complex-KDA Qwen3 FineWeb-Edu MN5 smoke test"
dump_folder = "/gpfs/scratch/ehpc390/flame_runs/complex_kda_qwen3_smoke"
print_args = true

[training]
batch_size = 6
seq_len = 4096
context_len = 4096
gradient_accumulation_steps = 1
steps = 10
max_norm = 1.0
skip_nan_inf = true
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 1
tensor_parallel_degree = 1
compile = false
dataset = "parquet"
dataset_split = "train"
data_files = "/gpfs/scratch/ehpc390/fineweb-edu/sample-100BT-qwen3-budget30B/*.parquet"
streaming = true
num_workers = 1
pin_memory = false
persistent_workers = false
prefetch_factor = 2
seed = 42
varlen = false

[optimizer]
name = "MuonWithAuxAdam"
eps = 1e-10
lr = 2e-2
adamw_lr = 3e-4
momentum = 0.95
weight_decay = 0.01

[lr_scheduler]
warmup_steps = 2
decay_type = "cosine"
lr_min = 0.1

[checkpoint]
enable_checkpoint = false
folder = "checkpoint"
interval_type = "steps"
interval = 10
model_weights_only = false
export_dtype = "float32"
async_mode = "disabled"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 512

[metrics]
log_freq = 1
enable_wandb = false

[experimental]
context_parallel_degree = 1
pipeline_parallel_degree = 1

[float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false

[activation_checkpoint]
mode = "none"
